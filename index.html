<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 주식 계좌 대시보드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', 'IBM Plex Sans', sans-serif;
      background-color: #f8f9fa;
    }
    #root {
      min-height: 100vh;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function StockDashboard() {
      // 데이터 예시
      const [data, setData] = useState({
        totalInvestment: 12345678,
        totalAsset: 14567890,
        totalProfit: 2222212,
        totalProfitRate: 18.00
      });

      // 1원 단위 반올림 및 세 자리 쉼표 포맷팅
      const formatCurrency = (val) => {
        if (val === null || val === undefined || isNaN(val)) return '0원';
        return `${Math.round(Number(val)).toLocaleString('ko-KR')}원`;
      };

      // 수익률 포맷팅
      const formatRate = (val) => {
        if (val === null || val === undefined || isNaN(val)) return '0.00%';
        const num = Number(val);
        const sign = num > 0 ? '+' : '';
        return `${sign}${num.toFixed(2)}%`;
      };

      return (
        <div style={{ maxWidth: '1200px', margin: '0 auto' }}>
          <div
            style={{
              display: 'flex',
              justifyContent: 'space-between',
              alignItems: 'center',
              flexWrap: 'nowrap',
              backgroundColor: '#ffffff',
              padding: '16px 24px',
              borderRadius: '12px',
              boxShadow: '0 2px 8px rgba(0,0,0,0.06)',
              marginBottom: '20px',
              overflowX: 'auto'
            }}
          >
            <h1
              style={{
                margin: 0,
                fontSize: '1.25rem',
                fontWeight: 700,
                color: '#111827',
                whiteSpace: 'nowrap',
                flexShrink: 0
              }}
            >
              내 주식 계좌
            </h1>

            <div
              style={{
                display: 'flex',
                alignItems: 'center',
                gap: '24px',
                whiteSpace: 'nowrap',
                flexShrink: 0
              }}
            >
              <div style={{ display: 'flex', alignItems: 'baseline', gap: '8px' }}>
                <span style={{ fontSize: '0.875rem', color: '#6b7280', fontWeight: 500, whiteSpace: 'nowrap' }}>
                  원금 및 수익률
                </span>
                <span style={{ fontSize: '1.125rem', fontWeight: 600, color: '#111827', whiteSpace: 'nowrap' }}>
                  {formatCurrency(data.totalInvestment)}
                </span>
                <span
                  style={{
                    fontSize: '1rem',
                    fontWeight: 600,
                    color: data.totalProfitRate >= 0 ? '#dc2626' : '#2563eb',
                    whiteSpace: 'nowrap'
                  }}
                >
                  ({formatRate(data.totalProfitRate)})
                </span>
              </div>

              <div style={{ display: 'flex', alignItems: 'baseline', gap: '8px' }}>
                <span style={{ fontSize: '0.875rem', color: '#6b7280', fontWeight: 500, whiteSpace: 'nowrap' }}>
                  총 자산
                </span>
                <span style={{ fontSize: '1.25rem', fontWeight: 700, color: '#111827', whiteSpace: 'nowrap' }}>
                  {formatCurrency(data.totalAsset)}
                </span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<StockDashboard />);
  </script>
</body>
</html>
