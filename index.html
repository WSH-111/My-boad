<!-- Preview helper: intercept fetch for portfolio_data.json and load from test branch raw URL -->
<script>
(function(){
  try {
    const RAW_JSON = 'https://raw.githubusercontent.com/dicahong1/Stock-status/test/portfolio_data.json';
    const _fetch = window.fetch.bind(window);
    window.fetch = function(input, init){
      try{
        const url = (typeof input === 'string') ? input : (input && input.url);
        if(url && url.endsWith('portfolio_data.json')){
          return _fetch(RAW_JSON, init);
        }
      }catch(e){ /* ignore and fallback */ }
      return _fetch(input, init);
    };
    // also override XMLHttpRequest for older code that might use it
    const XHR = window.XMLHttpRequest;
    if(XHR){
      function X(){
        const xhr = new XHR();
        const _open = xhr.open;
        xhr.open = function(method, url){
          try{
            if(url && url.endsWith('portfolio_data.json')){
              url = RAW_JSON;
            }
          }catch(e){}
          return _open.apply(this, [method, url].concat([].slice.call(arguments,2)));
        };
        return xhr;
      }
      X.prototype = XHR.prototype;
      window.XMLHttpRequest = X;
    }
  } catch(e){ console.error('preview helper error', e); }
})();
</script>
