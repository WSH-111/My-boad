name: 주식 데이터 자동 갱신

on:
  schedule:
    - cron: "0 0,2,4,6,8 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 데이터 갱신 스크립트 실행
        env:
          NH_APPKEY: ${{ secrets.NH_APPKEY }}
          NH_APPSECRETKEY: ${{ secrets.NH_APPSECRETKEY }}
          NH_ACCOUNT_NO: ${{ secrets.NH_ACCOUNT_NO }}
        run: python update_data.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add portfolio_data.json
          git diff --cached --quiet || git commit -m "chore: 주식 데이터 자동 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
