name: portfolio-update

on:
  schedule:
    # 한국시간 평일 09:00 ~ 15:30 (UTC 기준 00:00 ~ 06:30) 10분 간격 실행   
    - cron: "0,30 0-8 * * MON-FRI"
  workflow_dispatch: # 수동 실행 버튼 유지
  

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - env:
          NH_APPKEY: ${{ secrets.NH_APPKEY }}
          NH_APPSECRETKEY: ${{ secrets.NH_APPSECRETKEY }}
          NH_ACCOUNT_NO: ${{ secrets.NH_ACCOUNT_NO }}
        run: python update_data.py
      - run: |
          git config user.name portfolio-bot
          git config user.email actions@users.noreply.github.com
          git add portfolio_data.json
          git diff --cached --quiet || git commit -m auto-update
          git push
