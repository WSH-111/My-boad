name: portfolio-update

on:
  schedule:
    - cron: '0 0,2,4,6,8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - env:
          NH_APPKEY: ${{ secrets.NH_APPKEY }}
          NH_APPSECRETKEY: ${{ secrets.NH_APPSECRETKEY }}
          NH_ACCOUNT_NO: ${{ secrets.NH_ACCOUNT_NO }}
        run: python update_data.py
      - run: |
          git config user.name portfolio-bot
          git config user.email actions@users.noreply.github.com
          git add portfolio_data.json
          git diff --cached --quiet || git commit -m auto-update
          git push
